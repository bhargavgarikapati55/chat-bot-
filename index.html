<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>ChatGPT UI Clone</title>
    <link rel="stylesheet" href="style.css">
    <link href="https://fonts.googleapis.com/css2?family=Inter:wght@400;500;600&display=swap" rel="stylesheet">
    <link rel="stylesheet" href="https://cdnjs.cloudflare.com/ajax/libs/font-awesome/6.4.0/css/all.min.css">
</head>
<body>
    <div class="app-container">
        <!-- Sidebar -->
        <aside class="sidebar">
            <div class="sidebar-top">
                <a href="#" class="nav-item" id="new-chat-btn">
                    <span class="icon-container"><i class="fa-solid fa-plus"></i></span>
                    New chat
                </a>
                <a href="#" class="nav-item">
                     <span class="icon-container"><i class="fa-solid fa-magnifying-glass"></i></span>
                    Search chats
                </a>
                <a href="#" class="nav-item">
                     <span class="icon-container"><i class="fa-regular fa-image"></i></span>
                    Images
                </a>
                <a href="#" class="nav-item">
                     <span class="icon-container"><i class="fa-solid fa-cubes"></i></span>
                    Apps
                </a>
                <a href="#" class="nav-item">
                     <span class="icon-container"><i class="fa-solid fa-flask"></i></span>
                    Deep research
                </a>
                <a href="#" class="nav-item">
                     <span class="icon-container"><i class="fa-solid fa-heart-pulse"></i></span>
                    Health
                </a>
            </div>
            
            <div class="sidebar-bottom">
                 <a href="#" class="nav-item">
                     <span class="icon-container"><i class="fa-solid fa-bolt"></i></span>
                    See plans and pricing
                </a>
                <a href="#" class="nav-item">
                     <span class="icon-container"><i class="fa-solid fa-gear"></i></span>
                    Settings
                </a>
                <a href="#" class="nav-item">
                     <span class="icon-container"><i class="fa-regular fa-circle-question"></i></span>
                    Help
                </a>
                <div class="login-prompt">
                    <h4>Get responses tailored to you</h4>
                    <p>Log in to get answers based on saved chats, plus create images and upload files.</p>
                    <button class="btn-sidebar-login">Log in</button>
                </div>
            </div>
        </aside>

        <!-- Main Content -->
        <main class="main-content">
            <header class="top-header">
                <div class="header-left">
                    <h2>ChatGPT <i class="fa-solid fa-chevron-down" style="font-size: 12px; margin-left:5px; color:#b4b4b4;"></i></h2>
                </div>
                <div class="header-right">
                    <button class="btn-top-login">Log in</button>
                    <button class="btn-signup">Sign up for free</button>
                </div>
            </header>

            <div id="chat-history" style="display: none; flex-direction: column; flex-grow: 1; padding: 40px 20px; overflow-y: auto; gap: 24px; max-width: 800px; margin: 0 auto; width: 100%;">
                <!-- Chat messages map here -->
            </div>

            <div class="center-content" id="welcome-screen">
                <h1 class="greeting">What's on your mind today?</h1>
            </div>

            <div class="input-wrapper" style="width: 100%; display: flex; justify-content: center; padding-bottom: 30px; position: relative; bottom: 0; background: linear-gradient(180deg, rgba(33,33,33,0) 0%, rgba(33,33,33,1) 40%);">
                <div class="search-container">
                    <div class="search-box">
                        <input type="text" placeholder="Ask anything" id="chat-input" autocomplete="off">
                        <button class="voice-btn" id="send-btn"><i class="fa-solid fa-paper-plane" style="margin-right: 5px;"></i> Send</button>
                    </div>
                </div>
            </div>
        </main>
    </div>
    <!-- Auth Modal -->
    <div id="auth-modal" class="modal-overlay" style="display: none;">
        <div class="modal-content">
            <span class="close-modal">&times;</span>
            <h2 id="modal-title">Welcome back</h2>
            <form id="auth-form">
                <input type="email" placeholder="Email address" required class="modal-input">
                <input type="password" placeholder="Password" required class="modal-input">
                <button type="submit" class="modal-submit-btn">Continue</button>
            </form>
            <p style="text-align: center; margin-top: 15px; font-size: 13px; color: #b4b4b4;">
                This is a mock login popup.
            </p>
        </div>
    </div>
    <script src="script.js"></script>
</body>
</html>
